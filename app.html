}

const swipeMainTabOrder=[0,1,5,2,4,10];
let swipeNavigationInitialized=false;
function initializeSwipeNavigation(){
  if(swipeNavigationInitialized)return;
  const main=document.querySelector('main');if(!main)return;
  swipeNavigationInitialized=true;
  const ignoredTargetSelector='input,textarea,select,button,a,form,.form,[contenteditable="true"],[role="slider"],canvas,svg,iframe,video,[data-swipe-ignore]';
  const hasOpenDialog=()=>Array.from(document.querySelectorAll('[aria-modal="true"],[role="dialog"],.cookie-banner')).some(element=>!element.hidden&&!element.closest('[hidden]')&&getComputedStyle(element).display!=='none');
  const hasHorizontalScroller=target=>{for(let element=target;element&&element!==main.parentElement;element=element.parentElement){const overflow=getComputedStyle(element).overflowX;if((overflow==='auto'||overflow==='scroll')&&element.scrollWidth>element.clientWidth+2)return true}return false};
  let start=null;
  main.addEventListener('touchstart',event=>{
    start=null;
    if(event.touches.length!==1||hasOpenDialog())return;
    const touch=event.touches[0],target=event.target?.nodeType===1?event.target:event.target?.parentElement,active=target?.closest('.tab.active');
    if(!target||!active||!main.contains(active)||target.closest(ignoredTargetSelector)||hasHorizontalScroller(target))return;
    start={x:touch.clientX,y:touch.clientY,tabId:active.id,target};
  },{passive:true});
  main.addEventListener('touchmove',event=>{if(start&&event.touches.length!==1)start=null},{passive:true});
  main.addEventListener('touchcancel',()=>{start=null},{passive:true});
  main.addEventListener('touchend',event=>{
    if(!start||event.changedTouches.length!==1||hasOpenDialog()){start=null;return}
    const initial=start,touch=event.changedTouches[0],dx=touch.clientX-initial.x,dy=touch.clientY-initial.y;start=null;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.35||hasHorizontalScroller(initial.target))return;
    const active=document.querySelector('.tab.active');if(!active||active.id!==initial.tabId)return;
    const current=swipeMainTabOrder.indexOf(Number(active.id.slice(1)));if(current<0)return;
    const next=current+(dx<0?1:-1);if(next<0||next>=swipeMainTabOrder.length)return;
    tab(swipeMainTabOrder[next]);
  },{passive:true});
}

async function openBillingPortal(){
  const buttons=[document.getElementById('fiexeaManageSubscription'),document.getElementById('profileManageSubscription')].filter(Boolean);
  if(button)button.disabled=true;
  try{
    const{data:{session},error}=await fiexeaSupabase.auth.getSession();
    if(error||!session)throw new Error('Inicia sesión para gestionar tu suscripción.');
    const response=await fetch(FIEXEA_SUPABASE_URL+'/functions/v1/create-checkout-session',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':FIEXEA_SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({action:'portal'})});
    const result=await response.json();
    if(!response.ok||!result.url)throw new Error(result.error||'No se pudo abrir la gestión de suscripciones.');
    const url=new URL(result.url);
    if(url.protocol!=='https:'||url.hostname!=='billing.stripe.com')throw new Error('No se pudo verificar el enlace de gestión.');
    window.location.assign(url.href);
  }catch(error){alert(error.message||'Contacta con soporte@fiexea.es para gestionar tu suscripción.');}
  finally{buttons.forEach(button=>button.disabled=false);}
}
window.openBillingPortal=openBillingPortal;
async function startCheckout(plan){
  const suffix=plan==='annual'?'Annual':'Monthly';
  if(!['monthly','annual'].includes(plan)){alert('Plan no válido.');return}
  if(!document.getElementById('legalTerms'+suffix)?.checked||!document.getElementById('legalStart'+suffix)?.checked){alert('Lee y acepta los términos y la información de inicio del servicio para continuar.');return}
  try{
    const {data:{session},error}=await fiexeaSupabase.auth.getSession();

    if(error||!session){
      alert('Inicia sesión primero para continuar.');
      return;
    }

    const response=await fetch(
      'https://utwdxwnmgaojcqkqhouz.supabase.co/functions/v1/create-checkout-session',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer '+session.access_token,
          'apikey':FIEXEA_SUPABASE_PUBLISHABLE_KEY
        },
        body:JSON.stringify({plan})
      }
    );

    const result=await response.json();

    if(!response.ok||!result.url){
      throw new Error(result.error||'No se pudo iniciar el pago');
    }

    window.location.href=result.url;
  }catch(error){
    console.error('Error iniciando Checkout:',error);
    alert(error.message||'No se pudo iniciar el pago.');
  }
}


const FIEXEA_LEGAL=Object.freeze({owner:'',taxId:'',address:'',email:'soporte@fiexea.es'});
const FIEXEA_LEGAL_CONTENT={
notice:`<h3>Titular y datos identificativos</h3>{{legalIdentity}}<p>FIEXEA es una aplicación web para organizar información financiera personal que introduce el usuario: movimientos, presupuestos, deudas, patrimonio, objetivos y cuentas manuales.</p><h3>Objeto, responsabilidad y propiedad intelectual</h3><p>La aplicación ofrece herramientas de organización y cálculos informativos; no presta asesoramiento financiero, fiscal, contable ni jurídico personalizado. El usuario es responsable de la información que introduce y de proteger el dispositivo y sus credenciales. Las marcas, el diseño, los textos y el código corresponden a sus titulares. El acceso y uso se rigen por estos documentos y por la normativa aplicable, sin limitar derechos imperativos de las personas consumidoras.</p>`,
privacy:`<h3>Responsable</h3>{{legalIdentity}}<p>El responsable del tratamiento es la persona o entidad identificada en los datos anteriores. Contacto: <a href="mailto:soporte@fiexea.es">soporte@fiexea.es</a>. Los datos identificativos completos del titular están pendientes de completar.</p><h3>Datos tratados y almacenamiento</h3><p>Para acceder y gestionar la cuenta, Supabase Auth recibe el correo electrónico, la contraseña introducida y los datos técnicos de la sesión. El registro, cuando está disponible, permite crear una cuenta con correo y contraseña. La prueba dura 72 horas desde la creación de la cuenta; al terminar, se requiere una suscripción activa para continuar.</p><p>Los movimientos, presupuestos, categorías, planificación, deudas, patrimonio, objetivos, cuentas manuales y preferencias se guardan primero en el almacenamiento local del navegador. Cuando existe una sesión autenticada, FIEXEA sincroniza la copia financiera con la fila asociada al identificador de esa cuenta en Supabase. La sesión de acceso también se conserva en el almacenamiento local del navegador. En un dispositivo compartido, otras personas con acceso al mismo perfil del navegador podrían acceder a los datos locales; cierra sesión y protege el dispositivo.</p><p>La foto de perfil se conserva en una caché local y, al cargarla con sesión, en el almacenamiento privado de Supabase Storage dentro de la carpeta de la cuenta. FIEXEA usa enlaces temporales para mostrarla.</p><p>Al iniciar un pago Premium, FIEXEA envía a una función de Supabase el plan elegido y la sesión autenticada; después abre Stripe Checkout. Los datos de pago se introducen en el servicio de Stripe, no en un formulario de tarjeta de FIEXEA. Las exportaciones CSV y las copias de seguridad se generan a petición del usuario y se descargan en su dispositivo.</p><h3>Finalidades y bases del tratamiento</h3><p>Los datos de cuenta y sesión se utilizan para autenticar el acceso, mantener la seguridad y prestar las funciones asociadas a la cuenta. Los datos financieros se utilizan para mostrar las herramientas, cálculos y sincronización que solicita el usuario. Los datos enviados al contratar Premium se utilizan para iniciar y gestionar el proceso de pago y la suscripción; los proveedores pueden tratar la información necesaria para sus obligaciones contractuales y legales. El almacenamiento local funcional permite recordar los datos, preferencias y sesión necesarios para el uso de la aplicación. FIEXEA no incorpora herramientas de analítica ni publicidad.</p><p>Cuando corresponda, las bases jurídicas son la ejecución de la relación de cuenta o del servicio solicitado, el cumplimiento de obligaciones legales y el interés legítimo en proteger la seguridad del servicio. Si un tratamiento concreto requiere consentimiento, se solicitará por separado y podrá retirarse.</p><h3>Servicios que reciben datos</h3><p>Supabase presta la autenticación, la base de datos financiera, las funciones de sincronización y pago y el almacenamiento privado de fotos. Stripe procesa el pago en su página de Checkout. GitHub Pages aloja la aplicación y jsDelivr entrega la biblioteca de Supabase que carga el navegador. Estos servicios pueden recibir datos técnicos de conexión conforme a sus propias condiciones y avisos de privacidad.</p><h3>Control de la prueba</h3><p>Para evitar que borrar y volver a crear una cuenta reinicie la prueba, se conserva un registro de su inicio y fin asociado a una huella criptográfica del correo normalizado. El registro de pruebas no guarda el correo en texto y no puede modificarse desde la aplicación.</p><h3>Conservación y transferencias</h3><p>La copia local permanece en el navegador hasta que el usuario la elimina desde FIEXEA o el navegador, o hasta que se pierde ese almacenamiento. La copia sincronizada y la cuenta se conservan en los servicios asociados mientras la cuenta siga activa, salvo eliminación o conservación exigida por ley. Desde Perfil → Cuenta se puede solicitar la eliminación de la cuenta; cuando el servidor confirma la operación, FIEXEA cierra la sesión y elimina la caché local asociada y la foto. Los proveedores pueden conservar cierta información cuando sea necesario para cumplir obligaciones legales.</p><p>Los datos se procesan en la infraestructura de los proveedores indicados. La ubicación y las garantías de cualquier transferencia internacional dependen de la región y las condiciones configuradas para cada servicio; consulta también los avisos de privacidad de Supabase, Stripe, GitHub y jsDelivr.</p><h3>Seguridad, derechos y reclamaciones</h3><p>Las consultas y cambios de datos se realizan con la sesión de la cuenta y las reglas de acceso del servicio. La copia local depende de la seguridad del dispositivo; se recomienda protegerlo y cerrar sesión cuando lo compartas. No guardes claves bancarias en FIEXEA: la conexión bancaria real no está disponible.</p><p>Cuando proceda, puedes solicitar acceso, rectificación, supresión, limitación, oposición y portabilidad, así como retirar un consentimiento otorgado, contactando con el responsable. Contacto: <a href="mailto:soporte@fiexea.es">soporte@fiexea.es</a>. También puedes presentar una reclamación ante la Agencia Española de Protección de Datos o ante la autoridad de protección de datos competente.</p>`,
cookies:`<h3>Almacenamiento en tu navegador</h3><p>FIEXEA no escribe cookies propias mediante código de la aplicación ni utiliza categorías propias de analítica o publicidad. Para funcionar, guarda datos financieros, preferencias y la confirmación de lectura de este aviso en el almacenamiento local del navegador (localStorage). Aunque cumple una función de almacenamiento en el dispositivo, localStorage es distinto de una cookie HTTP.</p><p>Cuando inicias sesión, la biblioteca de Supabase conserva la sesión de autenticación en el almacenamiento local del navegador. Los datos financieros también se sincronizan con tu cuenta de Supabase. FIEXEA carga esa biblioteca desde jsDelivr y está alojada en GitHub Pages.</p><h3>Servicios externos</h3><p>Al iniciar sesión, las solicitudes se envían a Supabase. Si contratas Premium, FIEXEA te redirige a Stripe Checkout, que puede utilizar sus propias tecnologías en su dominio. La aplicación no puede administrar las cookies o tecnologías que esos proveedores utilicen en sus propios servicios; consulta sus políticas y la configuración de tu navegador.</p><h3>Preferencias</h3><p>FIEXEA no activa analítica, publicidad ni otras categorías opcionales propias, por lo que no te presenta una elección ficticia entre aceptarlas o rechazarlas. El aviso permite confirmar que has leído esta información y abrir esta política. Puedes borrar el almacenamiento local desde el navegador; al hacerlo podrías perder datos no sincronizados, preferencias o la sesión.</p>`,
terms:`<h3>Servicio y cuenta</h3><p>FIEXEA permite organizar información financiera personal que introduce el usuario y consultar cálculos informativos. El acceso autenticado se gestiona mediante Supabase. Mantén tus credenciales privadas y usa un dispositivo seguro. Eres responsable de la exactitud y legalidad de los datos que introduces.</p><h3>Datos y disponibilidad</h3><p>Los datos se guardan localmente y, si has iniciado sesión, se sincronizan con la cuenta asociada. El funcionamiento puede depender del navegador, la conexión y los servicios externos, por lo que pueden producirse interrupciones. Puedes crear una copia de seguridad y exportar datos; conserva las copias descargadas de forma segura. Al cerrar sesión, la aplicación conserva una caché local separada para la cuenta.</p><h3>Uso de la aplicación</h3><p>No utilices FIEXEA para actividades ilícitas, interferir con su seguridad o intentar acceder a datos de otras personas. Los resultados dependen de los datos introducidos y no constituyen asesoramiento financiero, fiscal, contable o jurídico ni recomendaciones de inversión. Verifica los importes y cálculos antes de tomar decisiones.</p><h3>Premium, pagos y cancelación</h3><p>La pantalla Premium anuncia una prueba de 3 días y muestra los precios de 4,99 € al mes y 45 € al año. Para iniciar el pago, FIEXEA envía a Supabase el plan elegido y abre Stripe Checkout; revisa allí las condiciones, el importe final, impuestos, duración de la prueba, renovación y cancelación antes de confirmar. FIEXEA no recoge los datos de la tarjeta en la aplicación. Desde Premium → Gestionar suscripción puedes abrir el portal de Stripe y consultar las opciones disponibles para tu suscripción. Para solicitar ayuda, escribe a soporte@fiexea.es.</p><h3>Contenido, cambios y ley</h3><p>Conservas los derechos sobre el contenido que introduces. El titular mantiene los derechos sobre FIEXEA. El servicio y estos términos pueden actualizarse con información visible, respetando los derechos aplicables. Se aplica la legislación que corresponda, sin limitar derechos imperativos de las personas consumidoras ni las reglas de competencia territorial.</p>{{legalIdentity}}`,
subscription:`<h3>Planes anunciados</h3><p>La pantalla Premium anuncia una prueba gratuita de 3 días y muestra un plan mensual de 4,99 € y un plan anual de 45 €. La prueba dura 72 horas desde la creación de la cuenta, sin tarjeta. Contratar un plan no inicia otra prueba. Revisa en Stripe Checkout el importe y las condiciones antes de confirmar la compra.</p><h3>Proceso de pago</h3><p>Al elegir un plan, FIEXEA solicita la sesión autenticada y envía el identificador del plan a una función de Supabase, que devuelve la dirección de Checkout. El usuario continúa en Stripe para revisar la oferta y facilitar, en su caso, los datos de pago. FIEXEA no solicita ni almacena números de tarjeta en sus formularios.</p><p>Antes de confirmar, revisa el precio total, impuestos, periodicidad, duración y condiciones de la prueba, renovación, acceso y cancelación que se muestren en Checkout. La suscripción y los pagos se procesan conforme a las condiciones presentadas por Stripe y a la normativa aplicable.</p>`,
withdrawal:`<h3>Gestión y cancelación</h3><p>Abre Premium → Gestionar suscripción para acceder al portal de Stripe y consultar las opciones disponibles de facturación y cancelación de la renovación. Si no puedes acceder o necesitas ayuda, escribe a soporte@fiexea.es. No envíes números completos de tarjeta por correo electrónico.</p><h3>Desistimiento</h3><p>En los contratos a distancia, las personas consumidoras disponen, con carácter general, de un plazo de 14 días naturales para desistir, sujeto a las excepciones y requisitos previstos en la normativa aplicable. El inicio de un servicio digital durante ese plazo puede tener efectos solo cuando se cumplen los requisitos legales de información y consentimiento; marcar una casilla no implica por sí solo una renuncia general a derechos.</p><p>Las condiciones concretas, la forma de comunicar el desistimiento y los efectos sobre pagos o acceso dependen del contrato celebrado y de la legislación aplicable. Consulta las condiciones recibidas al contratar y contacta con el responsable mediante los datos legales publicados.</p>`,
finance:`<h3>Uso informativo</h3><p>FIEXEA ayuda a organizar los datos que introduce el usuario sobre ingresos, gastos, deudas, patrimonio, presupuestos y objetivos. Puede mostrar cálculos, estadísticas y proyecciones basadas en esos datos. No sustituye a un asesor financiero profesional ni constituye asesoramiento financiero, fiscal, contable o jurídico personalizado ni una recomendación de inversión.</p><p>Los resultados dependen de la exactitud y actualización de los datos introducidos. Compruébalos antes de tomar decisiones económicas y valora obtener asesoramiento profesional adecuado a tu situación.</p>`,
contact:`<h3>Contacto legal y privacidad</h3>{{legalIdentity}}<p>Utiliza los datos de contacto del responsable para consultas sobre privacidad, ejercicio de derechos, suscripciones, desistimiento o eliminación de cuenta. Puedes escribir a <a href="mailto:soporte@fiexea.es">soporte@fiexea.es</a>.</p>`
};

<script id="fiexea-home-chart-sync">
(()=>{const ids=['mIncome','mExpense','mSave'];const parse=v=>{const x=(v||'').replace(/[^0-9,.-]/g,'').replace(/\./g,'').replace(',','.');return Number(x)||0};const update=()=>{const nodes=ids.map(id=>document.getElementById(id));if(nodes.some(n=>!n))return;const [a,b,c]=nodes.map(n=>n.textContent.trim());const income=Math.max(0,parse(a)),expense=Math.max(0,parse(b)),total=income+expense;const donut=document.getElementById('homeChartDonut');if(!donut)return;const p=total>0?income/total*100:0;donut.style.background=total>0?'conic-gradient(#10a976 0 '+p+'%,#ef565a '+p+'% 100%)':'conic-gradient(#dbe5e7 0 100%)';document.getElementById('homeChartIncome').textContent=a;document.getElementById('homeChartExpense').textContent=b;document.getElementById('homeChartBalance').textContent=c;document.getElementById('homeChartCenter').textContent=a};const start=()=>{update();const nodes=ids.map(id=>document.getElementById(id)).filter(Boolean);const observer=new MutationObserver(update);nodes.forEach(n=>observer.observe(n,{childList:true,characterData:true,subtree:true}));};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start()})();
</script>
